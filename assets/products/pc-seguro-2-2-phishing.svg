<svg xmlns="http://www.w3.org/2000/svg" width="660" height="920" viewBox="0 0 660 920" role="img" aria-labelledby="title desc">
<title id="title">Prévia editorial do módulo de phishing do PC Seguro 2.2</title><desc id="desc">Esquema ilustrativo baseado no módulo 3 do guia: sinais de golpe e método Pare, Verifique e Confirme.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9fd"/><stop offset="1" stop-color="#dceaf9"/></linearGradient></defs>
<rect width="660" height="920" fill="url(#b)"/><rect x="32" y="31" width="596" height="858" rx="18" fill="#fff" stroke="#d6e3f0"/><rect x="32" y="31" width="596" height="13" rx="6" fill="#2f80ed"/>
<text x="65" y="88" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#143357">PROXITI</text><text x="65" y="127" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#327bd3">MÓDULO 03 · PHISHING</text>
<text x="65" y="183" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#101f33">Pare antes de obedecer.</text><text x="65" y="215" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#56677c">Golpes exploram urgência e identidade falsa.</text>
<rect x="65" y="249" width="530" height="184" rx="15" fill="#0c223d"/><g fill="none" stroke="#8dbaf2" stroke-width="6" stroke-linejoin="round"><rect x="100" y="286" width="175" height="111" rx="15"/><path d="M110 297l77 57 78-57"/></g><path d="M433 285l75 130h-150Z" fill="none" stroke="#ffb168" stroke-width="8" stroke-linejoin="round"/><path d="M433 328v39" stroke="#ffb168" stroke-width="9" stroke-linecap="round"/><circle cx="433" cy="385" r="5" fill="#ffb168"/>
<text x="65" y="480" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#112943">Sinais para verificar</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#273e58"><text x="85" y="531">• Urgência artificial e conta “bloqueada”.</text><text x="85" y="568">• Pedido de senha, código ou Pix.</text><text x="85" y="605">• Domínio parecido com o serviço real.</text><text x="85" y="642">• Link, anexo ou QR Code inesperado.</text></g>
<rect x="65" y="675" width="530" height="154" rx="14" fill="#eaf3ff" stroke="#8bb7eb"/><text x="85" y="707" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" fill="#0a4586">PARE  →  VERIFIQUE  →  CONFIRME</text><text x="85" y="745" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#264c73">Não clique por impulso. Abra o canal oficial</text><text x="85" y="768" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#264c73">por conta própria e confirme a pessoa.</text>
<text x="65" y="863" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64778f">PRÉVIA EDITORIAL · EDIÇÃO 2.2 PREMIUM · PÁGINA 11</text></svg>